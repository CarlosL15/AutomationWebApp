services:
  frontend:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: social-media-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - social-media-network

networks:
  social-media-network:
    external: true
