services:
  db:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: social-media-db
    env_file:
      - ../.env
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social-media-network

volumes:
  pgdata:

networks:
  social-media-network:
    name: social-media-network
    driver: bridge
